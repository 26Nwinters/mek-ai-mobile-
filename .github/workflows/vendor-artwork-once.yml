name: One-time vendoring of approved MEK-AI artwork

on:
  push:
    paths:
      - '.github/workflows/vendor-artwork-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover artwork from this repository's own previously built APK
        uses: actions/download-artifact@v4
        with:
          name: MEK-AI-Mobile-v0.5.3-debug
          run-id: 39659538281
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-apk
      - name: Extract the two previously approved local assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          unzip -p downloaded-apk/app-debug.apk assets/mek.webp > app/src/main/assets/mek.webp
          unzip -p downloaded-apk/app-debug.apk assets/workshop.webp > app/src/main/assets/workshop.webp
          python3 - <<'PY'
          from pathlib import Path
          for name in ('mek.webp','workshop.webp'):
              data=(Path('app/src/main/assets')/name).read_bytes()
              assert len(data)>10000 and data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              print('Bundled',name,len(data),'bytes')
          PY
      - name: Commit assets into the current launcher repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/mek.webp app/src/main/assets/workshop.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor approved MEK-AI character and workshop artwork'
            git push origin HEAD:main
          fi
