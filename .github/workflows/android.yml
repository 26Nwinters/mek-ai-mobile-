name: Build MEK-AI Mobile APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK platform
        run: sdkmanager --install "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify artwork is checked into THIS repository
        run: python3 tools/prepare_art.py

      - name: Verify release metadata and security invariants
        run: python3 tools/check_release.py

      - name: Install small UI-test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify launcher and widget interactions
        run: npm test

      - name: Build disposable test APK for pull requests
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload pull request test APK (cannot be used for upgrades)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MEK-AI-Mobile-v0.7.2-PR-TEST-ONLY-UNSTABLE-SIGNATURE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Restore and verify permanent app signing key
        if: github.event_name != 'pull_request'
        env:
          MEK_SIGNING_KEYSTORE_B64: ${{ secrets.MEK_SIGNING_KEYSTORE_B64 }}
          MEK_SIGNING_PASSWORD: ${{ secrets.MEK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MEK_SIGNING_KEYSTORE_B64:-}" ] || [ -z "${MEK_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Permanent signing not configured. Add MEK_SIGNING_KEYSTORE_B64 and MEK_SIGNING_PASSWORD under Settings > Secrets and variables > Actions. No temporary-key upgrade will be built."
            exit 1
          fi
          KEYFILE="$RUNNER_TEMP/mekai-permanent.p12"
          umask 077
          printf '%s' "$MEK_SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYFILE"
          chmod 600 "$KEYFILE"
          ACTUAL="$(keytool -list -v -storetype PKCS12 -keystore "$KEYFILE" -alias mekai-home -storepass "$MEK_SIGNING_PASSWORD" | sed -n 's/^.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="E44DBA69D602BD2AC79411B2D0828CF5E7A5B16B5525B72D33681B520CC71914"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch: refusing to rotate MEK-AI's permanent key."
            exit 1
          fi
          echo "::notice::Permanent signing certificate verified. The release can update prior installs signed with this key."

      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        env:
          MEK_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/mekai-permanent.p12
          MEK_SIGNING_PASSWORD: ${{ secrets.MEK_SIGNING_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK signature matches permanent certificate
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APK_SIGNER" && test -x "$APK_SIGNER" && test -f "$APK"
          "$APK_SIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/mekai-signature-report.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/mekai-signature-report.txt" | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="E44DBA69D602BD2AC79411B2D0828CF5E7A5B16B5525B72D33681B520CC71914"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK certificate differs from MEK-AI's pinned permanent signing certificate."
            exit 1
          fi
          echo "::notice::Signed APK verified; stable update signature confirmed."

      - name: Upload permanent-key Android upgrade APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MEK-AI-Mobile-v0.7.2-PERMANENT-SIGNED-UPGRADE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
