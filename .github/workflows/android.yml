name: Build MEK-AI Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install small UI-test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify editable launcher interactions
        run: npm test
      - name: Prepare approved artwork
        run: |
          python -m pip install --quiet pillow
          python tools/prepare_art.py
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MEK-AI-Mobile-v0.2.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
