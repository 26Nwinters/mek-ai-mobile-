name: Build MEK-AI Mobile APK

on:
  push:
    branches: [main, fix-v0.6.4-native-widget-visibility]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK platform
        run: sdkmanager --install "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify artwork is checked into THIS repository
        run: python3 tools/prepare_art.py

      - name: Verify release metadata and security invariants
        run: python3 tools/check_release.py

      - name: Install small UI-test dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Verify launcher and widget interactions
        run: npm test

      - name: Restore persistent debug signing key when configured
        env:
          MEK_DEBUG_KEYSTORE_B64: ${{ secrets.MEK_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$MEK_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$MEK_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android > /dev/null
            echo "MEK_STABLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "::notice::Persistent debug keystore restored: upgrades using the SAME key can install in-place."
          else
            echo "MEK_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::MEK_DEBUG_KEYSTORE_B64 is missing. This APK will have an EPHEMERAL signing key and CANNOT update a previous debug build. Do not distribute as an upgrade."
          fi

      - name: Build Android APK (SDK 36)
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload stable-key upgrade APK
        if: env.MEK_STABLE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MEK-AI-Mobile-v0.6.4-STABLE-KEY-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload temporary-key test APK (not an upgrade)
        if: env.MEK_STABLE_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MEK-AI-Mobile-v0.6.4-TEMPORARY-KEY-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
